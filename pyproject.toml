[project]
name = "story-finder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0,<22",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Eval arms only. `summarizer` picks one of these once the eval decides;
# until then neither is a runtime dependency of the bot.
evals = ["anthropic>=1.0,<2", "openai>=3.0,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_finder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["contract: hits a live external API; excluded by default"]
addopts = "-m 'not contract'"
